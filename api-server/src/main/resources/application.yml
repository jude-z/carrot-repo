spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/testdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:00000000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379


jude:
  field:
    username: email
    password: password
  auth:
    default-url: /api/v1/auth
    login-url: /login
    logout-url: /logout
  kakao-token: ${KAKAO_TOKEN:kakao_token}
  kakao-url: ${KAKAO_URL:https://dapi.kakao.com/v2/local/geo/coord2regioncode.json}
  s3:
    bucket-name: ${S3_BUCKET_NAME:carrot-bucket}
    key-name: ${S3_KEY_NAME:images}
server:
  port: ${SERVER_PORT:8080}
