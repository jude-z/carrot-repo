# Prometheus 설정 - chat-server 부하 테스트용
#
# 실행 (호스트에서 직접):
#   prometheus --config.file=monitoring/prometheus.yml
# 실행 (Docker, Mac):
#   docker run -d --name prometheus -p 9090:9090 \
#     -v $(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#   -> targets 를 host.docker.internal:8080 으로 바꿔야 한다.
#
# 확인: http://localhost:9090/targets 에서 chat-server 가 UP 이면 된다.

global:
  scrape_interval: 15s          # job 에 값이 없을 때 쓰는 기본값

scrape_configs:
  - job_name: chat-server
    metrics_path: /actuator/prometheus   # 기본값(/metrics)이면 404
    scrape_interval: 5s                  # 부하 테스트 중 gauge(tomcat.threads.busy 등) 피크를 놓치지 않도록 짧게
    static_configs:
      - targets: ["localhost:8080"]      # Docker 로 Prometheus 를 띄우면 host.docker.internal:8080
